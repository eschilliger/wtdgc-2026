name: Monthly PDGA ratings sync

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Running hourly from 07:00 to 20:00 on Tuesdays lets
    # the detector start at 09:00 Europe/Paris in both CET and CEST, then retry hourly.
    - cron: "0 7-20 * * 2"

permissions:
  contents: read

concurrency:
  group: monthly-pdga-ratings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Detect PDGA monthly release
        id: release
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
          PDGA_API_USERNAME: ${{ secrets.PDGA_API_USERNAME }}
          PDGA_API_PASSWORD: ${{ secrets.PDGA_API_PASSWORD }}
          PDGA_API_BASE_URL: https://api.pdga.com
        run: npx tsx scripts/detect-pdga-rating-release.ts >> "$GITHUB_OUTPUT"

      - name: Stop when no release is available
        if: steps.release.outputs.released != 'true'
        run: echo "No new PDGA monthly ratings release to process."

      - name: Enrich all PDGA profiles
        if: steps.release.outputs.released == 'true' && steps.release.outputs.needs_sync == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
          PDGA_API_USERNAME: ${{ secrets.PDGA_API_USERNAME }}
          PDGA_API_PASSWORD: ${{ secrets.PDGA_API_PASSWORD }}
          PDGA_API_BASE_URL: https://api.pdga.com
        shell: bash
        run: |
          for offset in 0 100 200 300; do
            npx tsx scripts/enrich-all-pdga.ts --offset "$offset" --limit 100
          done

      - name: Import current rating history for all players
        if: steps.release.outputs.released == 'true' && steps.release.outputs.needs_sync == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
        shell: bash
        run: |
          for offset in 0 50 100 150 200 250 300 350; do
            npx tsx scripts/import-all-pdga-rating-history.ts --offset "$offset" --limit 50 --delay-ms 900 --force
          done

      - name: Recompute scouting metrics
        if: steps.release.outputs.released == 'true' && steps.release.outputs.needs_sync == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
        run: npx tsx scripts/compute-pdga-scouting-metrics.ts

      - name: Build update statistics report
        if: steps.release.outputs.released == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
        run: |
          npx tsx scripts/build-pdga-monthly-report.ts \
            --effective-date "${{ steps.release.outputs.effective_date }}" \
            --json "$RUNNER_TEMP/pdga-monthly-report.json" \
            --html "$RUNNER_TEMP/pdga-monthly-report.html"

      - name: Send confirmation email
        if: steps.release.outputs.released == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PDGA_REPORT_TO: eschilliger@gmail.com
          PDGA_REPORT_FROM: ${{ vars.PDGA_REPORT_FROM }}
        run: |
          npx tsx scripts/send-pdga-monthly-report.ts \
            --json "$RUNNER_TEMP/pdga-monthly-report.json" \
            --html "$RUNNER_TEMP/pdga-monthly-report.html"
