name: Enrich all WTDGC PDGA

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Index de départ dans la liste triée des numéros PDGA"
        required: true
        default: "0"
      limit:
        description: "Nombre de joueurs à enrichir (max 100)"
        required: true
        default: "50"

permissions:
  contents: read

jobs:
  enrich-pdga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Enrich PDGA batch
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: wtdgc-2026
          PDGA_API_USERNAME: ${{ secrets.PDGA_API_USERNAME }}
          PDGA_API_PASSWORD: ${{ secrets.PDGA_API_PASSWORD }}
          PDGA_API_BASE_URL: https://api.pdga.com
        run: npx tsx scripts/enrich-all-pdga.ts --offset "${{ inputs.offset }}" --limit "${{ inputs.limit }}"
