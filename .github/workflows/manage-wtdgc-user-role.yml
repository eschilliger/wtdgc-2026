name: Manage WTDGC user role

on:
  workflow_dispatch:
    inputs:
      email:
        description: Firebase Auth user email
        required: true
        type: string
      role:
        description: Application role
        required: true
        type: choice
        options:
          - player
          - staff

permissions:
  contents: read

jobs:
  assign-role:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Assign role
        run: npx tsx scripts/set-wtdgc-user-role.ts --email="${{ inputs.email }}" --role="${{ inputs.role }}"
